<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:decorate="~{layout}"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout.html}"
>

<head>
  <title>Contact - MediCare 3D</title>
  <style>
    .contact-card {
      max-width: 700px;
      margin: 0 auto;
    }

    .form-control {
      border-radius: 0.5rem;
      padding: 0.75rem 1rem;
      border: 1px solid #dee2e6;
      transition: all 0.3s ease;
    }

    .form-control:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 0.25rem rgba(42, 127, 186, 0.25);
    }
  </style>
</head>
<body>
<section layout:fragment="content">
  <div class="card-3d contact-card">
    <div class="card-body p-4">
      <h2 class="text-center mb-4"><i class="bi bi-envelope me-2"></i>Contactez-nous</h2>

      <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show">
        <span th:text="${successMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
      </div>

      <form th:action="@{/contact/send}" th:object="${contactMessage}" method="post">
        <div class="mb-3">
          <label for="name" class="form-label">Nom</label>
          <input type="text" id="name" th:field="*{name}" class="form-control" required>
        </div>
        <div class="mb-3">
          <label for="email" class="form-label">Email</label>
          <input type="email" id="email" th:field="*{email}" class="form-control" required>
        </div>
        <div class="mb-3">
          <label for="message" class="form-label">Message</label>
          <textarea id="message" th:field="*{message}" class="form-control" rows="5" required></textarea>
        </div>
        <div class="text-center">
          <button type="submit" class="btn btn-primary btn-3d px-4 py-2">
            <i class="bi bi-send me-2"></i>Envoyer
          </button>
        </div>
      </form>
    </div>
  </div>
</section>

<script>
  document.addEventListener('DOMContentLoaded', function() {
    const form = document.querySelector('form');
    if (form) {
      form.addEventListener('submit', async function(event) {
        event.preventDefault();

        const formData = {
          name: document.getElementById('name').value,
          email: document.getElementById('email').value,
          message: document.getElementById('message').value
        };

        try {
          const response = await fetch("http://localhost:8080/api/contact/send", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              "X-Requested-With": "XMLHttpRequest"
            },
            body: JSON.stringify(formData)
          });

          const result = await response.text();
          if (response.ok) {
            alert(result);
            form.reset();
          } else {
            alert("Error: " + result);
          }
        } catch (error) {
          alert("Network error: " + error.message);
        }
      });
    }
  });
</script>
</body>
</html>
