<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:decorate="~{layout}"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout.html}"
>
<head>
    <title>Consultations - MediCare 3D</title>
    <style>
        .consultation-table {
            background: white;
            border-radius: 1rem;
            overflow: hidden;
            box-shadow: var(--card-shadow);
        }

        .consultation-table thead {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
        }

        .action-btn {
            transition: all 0.3s ease;
            width: 40px;
            height: 40px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
        }

        .action-btn:hover {
            transform: scale(1.1);
        }
    </style>
</head>
<body>
<section layout:fragment="content">
    <div class="card-3d">
        <div class="card-body">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h2 class="mb-0"><i class="bi bi-clipboard2-pulse me-2"></i>Liste des Consultations</h2>
                <a th:href="@{/consultations/new}" class="btn btn-primary btn-3d">
                    <i class="bi bi-plus-circle me-1"></i> Nouvelle Consultation
                </a>
            </div>

            <div class="table-responsive">
                <table class="table consultation-table table-hover align-middle">
                    <thead>
                    <tr>
                        <th>ID</th>
                        <th>Date</th>
                        <th>Patient</th>
                        <th class="text-end">Actions</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="consultation : ${consultations}">
                        <td th:text="${consultation.idConsultation}"></td>
                        <td th:text="${consultation.dateConsultation}"></td>
                        <td th:text="${consultation.patient.prenom}"></td>
                        <td class="text-end">
                            <div class="d-flex justify-content-end gap-2">
                                <a th:href="@{/consultations/edit/{id}(id=${consultation.idConsultation})}"
                                   class="btn btn-sm btn-outline-primary action-btn">
                                    <i class="bi bi-pencil"></i>
                                </a>
                                <a th:href="@{/consultations/delete/{id}(id=${consultation.idConsultation})}"
                                   class="btn btn-sm btn-outline-danger action-btn">
                                    <i class="bi bi-trash"></i>
                                </a>
                            </div>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</section>
</body>
</html>
