<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:decorate="~{layout}"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout.html}"
>

<head>
    <title>Patients - MediCare 3D</title>
    <style>
        .patient-avatar {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, var(--primary), var(--primary-light));
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            margin-right: 1rem;
        }

        .patient-table {
            background: white;
            border-radius: 1rem;
            overflow: hidden;
            box-shadow: var(--card-shadow);
        }

        .patient-table thead {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
        }
    </style>
</head>
<body>
<section layout:fragment="content">
    <div class="card-3d">
        <div class="card-body">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h2 class="mb-0"><i class="bi bi-people me-2"></i>Liste des Patients</h2>
                <a th:href="@{/patients/new}" class="btn btn-primary btn-3d">
                    <i class="bi bi-plus-circle me-1"></i> Nouveau Patient
                </a>
            </div>

            <div class="table-responsive">
                <table class="table patient-table table-hover align-middle">
                    <thead>
                    <tr>
                        <th></th>
                        <th>Nom</th>
                        <th>Prénom</th>
                        <th>Email</th>
                        <th>Téléphone</th>
                        <th class="text-end">Actions</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="patient : ${patients}">
                        <td>
                            <div class="patient-avatar">
                                <span th:text="${patient.prenom.substring(0,1) + patient.nom.substring(0,1)}"></span>
                            </div>
                        </td>
                        <td th:text="${patient.nom}"></td>
                        <td th:text="${patient.prenom}"></td>
                        <td>
                            <a th:href="'mailto:' + ${patient.email}" th:text="${patient.email}"></a>
                        </td>
                        <td>
                            <a th:href="'tel:' + ${patient.tel}" th:text="${patient.tel}"></a>
                        </td>
                        <td class="text-end">
                            <div class="d-flex justify-content-end gap-2">
                                <a th:href="@{/patients/edit/{id}(id=${patient.idPatient})}"
                                   class="btn btn-sm btn-outline-primary btn-3d">
                                    <i class="bi bi-pencil"></i>
                                </a>
                                <a th:href="@{/patients/delete/{id}(id=${patient.idPatient})}"
                                   class="btn btn-sm btn-outline-danger btn-3d">
                                    <i class="bi bi-trash"></i>
                                </a>
                            </div>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</section>
</body>
</html>
