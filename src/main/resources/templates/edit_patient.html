<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:decorate="~{layout}"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout.html}"
>

<head>
    <title>Modifier Patient - MediCare 3D</title>
    <style>
        .patient-form {
            max-width: 800px;
            margin: 0 auto;
        }
    </style>
</head>
<body>
<section layout:fragment="content">
    <div class="card-3d patient-form">
        <div class="card-body p-4">
            <h2 class="mb-4"><i class="bi bi-person-lines-fill me-2"></i>Modifier Patient</h2>

            <form th:object="${patient}" action="/patients" method="post">
                <input type="hidden" name="idPatient" th:field="*{idPatient}"/>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="nom" class="form-label">Nom</label>
                        <input type="text" id="nom" th:field="*{nom}" class="form-control" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label for="prenom" class="form-label">Prénom</label>
                        <input type="text" id="prenom" th:field="*{prenom}" class="form-control" required>
                    </div>
                </div>

                <div class="mb-3">
                    <label for="email" class="form-label">Email</label>
                    <input type="email" id="email" th:field="*{email}" class="form-control" required>
                </div>

                <div class="mb-3">
                    <label for="telephone" class="form-label">Téléphone</label>
                    <input type="tel" id="telephone" th:field="*{tel}" class="form-control" required>
                </div>

                <div class="d-flex justify-content-end gap-2 mt-4">
                    <button type="submit" class="btn btn-primary btn-3d px-4">
                        <i class="bi bi-check-circle me-1"></i> Enregistrer
                    </button>
                    <button type="reset" class="btn btn-danger btn-3d px-4">
                        <i class="bi bi-x-circle me-1"></i> Annuler
                    </button>
                </div>
            </form>
        </div>
    </div>
</section>
</body>
</html>
